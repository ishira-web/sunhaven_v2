# /etc/nginx/sites-available/sunhaven
#
# After copying this file, run:
#   sudo ln -s /etc/nginx/sites-available/sunhaven /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sunhavenlanka.com -d www.sunhavenlanka.com
#
# certbot will rewrite this file to add the HTTPS server block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name sunhavenlanka.com www.sunhavenlanka.com;

    client_max_body_size 20M;

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else proxied to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
